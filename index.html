
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Color Stack — Water Sort Puzzle</title>
<meta name="description" content="Color Stack is a free water sort puzzle game: pour colored liquid between glass tubes and sort every color across 10 levels." />
<link rel="stylesheet" href="style.css" />
</head>
<body data-theme="space">

<div id="particles" class="particles" aria-hidden="true"></div>

<!-- ============ HOME ============ -->
<section class="page active" id="page-home">
  <div class="home-wrap">
    <h1 class="logo">COLOR<span>STACK</span></h1>
    <p class="tagline">Pour · Sort · Solve</p>

    <div class="hero-tubes" aria-hidden="true">
      <div class="tube demo"><div class="liq" style="height:25%;background:var(--c1)"></div><div class="liq" style="height:25%;background:var(--c2)"></div></div>
      <div class="tube demo"><div class="liq" style="height:25%;background:var(--c3)"></div><div class="liq" style="height:50%;background:var(--c4)"></div></div>
      <div class="tube demo"><div class="liq" style="height:25%;background:var(--c5)"></div><div class="liq" style="height:25%;background:var(--c6)"></div><div class="liq" style="height:25%;background:var(--c1)"></div></div>
    </div>

    <div class="menu">
      <button class="btn btn-primary big" data-go="game" id="btnPlay">▶ PLAY</button>
      <button class="btn" data-go="levels">🗺 Levels</button>
      <button class="btn" data-go="stats">🏆 Statistics</button>
      <button class="btn" data-go="settings">⚙ Settings</button>
    </div>

    <div class="glass panel home-stats">
      <div><span class="lbl">Best score</span><b id="homeBest">0</b></div>
      <div><span class="lbl">Progress</span><b id="homeProgress">1 / 10</b></div>
    </div>
  </div>
</section>

<!-- ============ LEVELS ============ -->
<section class="page" id="page-levels">
  <header class="topbar">
    <button class="icon-btn" data-go="home">←</button>
    <h2>Select Level</h2>
    <span class="spacer"></span>
  </header>
  <div class="level-grid" id="levelGrid"></div>
</section>

<!-- ============ SETTINGS ============ -->
<section class="page" id="page-settings">
  <header class="topbar">
    <button class="icon-btn" data-go="home">←</button>
    <h2>Settings</h2>
    <span class="spacer"></span>
  </header>
  <div class="glass panel list">
    <label class="row"><span>🔊 Sound</span><input type="checkbox" class="sw" data-set="sound"></label>
    <label class="row"><span>🎵 Music</span><input type="checkbox" class="sw" data-set="music"></label>
    <label class="row"><span>📳 Vibration</span><input type="checkbox" class="sw" data-set="vibration"></label>
    <label class="row"><span>✨ Animations</span><input type="checkbox" class="sw" data-set="animations"></label>
  </div>

  <h3 class="section-title">🌈 Theme</h3>
  <div class="theme-grid" id="themeGrid">
    <button class="theme-card" data-theme-pick="space"><span class="dots"></span>🌙 Dark Space</button>
    <button class="theme-card" data-theme-pick="light"><span class="dots"></span>☀️ Light</button>
    <button class="theme-card" data-theme-pick="ocean"><span class="dots"></span>🌊 Ocean</button>
    <button class="theme-card" data-theme-pick="neon"><span class="dots"></span>🌈 Neon</button>
  </div>

  <button class="btn btn-danger" id="btnReset">🗑 Reset Progress</button>
</section>

<!-- ============ STATS ============ -->
<section class="page" id="page-stats">
  <header class="topbar">
    <button class="icon-btn" data-go="home">←</button>
    <h2>Statistics</h2>
    <span class="spacer"></span>
  </header>
  <div class="stat-grid" id="statGrid"></div>
</section>

<!-- ============ GAME ============ -->
<section class="page" id="page-game">
  <header class="topbar game-bar">
    <button class="icon-btn" data-go="home">←</button>
    <div class="hud">
      <div class="hud-level" id="hudLevel">LEVEL 1</div>
      <div class="hud-sub"><span>⭐ <b id="hudScore">0</b></span><span>👣 <b id="hudMoves">0</b></span><span>⏱ <b id="hudTime">0:00</b></span></div>
    </div>
    <button class="icon-btn" id="btnPause">⏸</button>
  </header>

  <div class="board" id="board"></div>

  <footer class="game-actions">
    <button class="btn round" id="btnUndo">↩<small>Undo</small></button>
    <button class="btn round" id="btnRestart">🔄<small>Restart</small></button>
<!-- ============ MODALS ============ -->
<div class="overlay" id="pauseModal">
  <div class="glass modal">
    <h2>Paused</h2>
    <button class="btn btn-primary" id="btnResume">▶ Resume</button>
    <button class="btn" id="btnPauseRestart">🔄 Restart</button>
    <button class="btn" data-go="home">🏠 Home</button>
  </div>
</div>

<div class="overlay" id="winModal">
  <div class="glass modal">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <h2>Level Complete!</h2>
    <div class="stars" id="winStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="win-rows">
      <div><span>Score</span><b id="winScore">0</b></div>
      <div><span>Moves</span><b id="winMoves">0</b></div>
      <div><span>Time</span><b id="winTime">0:00</b></div>
      <div><span>Best</span><b id="winBest">0</b></div>
    </div>
    <button class="btn btn-primary" id="btnNext">Next Level →</button>
    <button class="btn" id="btnRetry">🔄 Retry</button>
    <button class="btn" data-go="home">🏠 Home</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
